<meta property="og:description" content="An interactive knowledge graph: companies, roles, projects, skills, domains and technologies, with live logos for brands, tools and products.">

<style>
  :root {
    --bg: #ffffff;
    --panel: #ffffff;
    --soft: #f7f8fb;
    --border: #e8eaf0;
    --border-strong: #d6d9e2;
    --text: #101322;
    --muted: #565c6b;
    --faint: #8a90a0;
    --indigo: #6366f1;
    --indigo-600: #4f46e5;
    --indigo-soft: #eef0fe;
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --display: "Righteous", var(--font);
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    background: rgba(255, 255, 255, 0.94);
  }
  .back {
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    border: 1px solid var(--border-strong);
    padding: 5px 12px;
    border-radius: 999px;
    white-space: nowrap;
    background: var(--panel);
  }
  .back:hover { color: var(--indigo-600); border-color: var(--indigo); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; white-space: nowrap; }
  header h1 .disp { font-family: var(--display); font-weight: 400; letter-spacing: 0.02em; }
  header h1 span { color: var(--indigo-600); }
  #stats { font-size: 12px; color: var(--faint); white-space: nowrap; }
  .controls { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  .search-wrap { position: relative; }
  #search {
    width: 210px;
    padding: 6px 12px;
    font-size: 13px;
    color: var(--text);
    background: var(--soft);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    outline: none;
    font-family: var(--font);
  }
  #search:focus { border-color: var(--indigo); background: #fff; }
  #matches {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    width: 260px;
    max-height: 300px;
    overflow-y: auto;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    display: none;
    z-index: 30;
    box-shadow: 0 12px 40px rgba(16, 19, 34, 0.14);
  }
  #matches button {
    display: block;
    width: 100%;
    text-align: left;
    padding: 8px 12px;
    background: none;
    border: 0;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    font-family: var(--font);
  }
  #matches button:last-child { border-bottom: 0; }
  #matches button:hover { background: var(--indigo-soft); }
  #matches button small { display: block; color: var(--faint); font-size: 11px; }
  #fitBtn {
    padding: 6px 12px;
    font-size: 13px;
    color: var(--text);
    background: var(--soft);
    border: 1px solid var(--border-strong);
    border-radius: 8px;
    cursor: pointer;
    font-family: var(--font);
  }
  #fitBtn:hover { border-color: var(--indigo); color: var(--indigo-600); }
  .powered-link {
    font-size: 12px;
    color: var(--muted);
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    padding: 5px 12px;
    white-space: nowrap;
    background: var(--panel);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .powered-link:hover { color: var(--indigo-600); border-color: var(--indigo); text-decoration: none; }

  main { flex: 1; display: flex; min-height: 0; }
  #canvasWrap { flex: 1; position: relative; overflow: hidden; background: var(--bg); }
  canvas { position: absolute; inset: 0; cursor: grab; touch-action: none; }
  #hint {
    position: absolute;
    left: 14px;
    bottom: 12px;
    font-size: 11px;
    font-family: var(--mono);
    color: var(--faint);
    pointer-events: none;
  }
  #loading {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: var(--muted);
    font-size: 14px;
    z-index: 5;
  }
  #loading.error { color: #dc2626; }

  aside {
    width: 380px;
    border-left: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  #legendPanel {
    flex: none;
    border-bottom: 1px solid var(--border);
    background: var(--soft);
    padding: 12px 14px 12px;
  }
  .panel-label {
    font-size: 11px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--faint);
    flex: 1;
    font-weight: 600;
  }
  #legendPanel .panel-label { display: block; padding: 0 2px 8px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px; }
  .legend button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
    background: #fff;
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    padding: 4px 10px;
    cursor: pointer;
    font-family: var(--font);
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .legend button:hover { border-color: var(--indigo); color: var(--indigo-600); }
  .legend button.active {
    background: var(--indigo-600);
    border-color: var(--indigo-600);
    color: #fff;
    font-weight: 600;
  }
  .legend button .count { font-size: 10.5px; opacity: 0.65; }
  .legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
  .legend button.all i { background: conic-gradient(#6366f1, #0ea5e9, #8b5cf6, #94a3b8, #94a3b8, #6366f1); }
  .legend-hint { font-size: 10.5px; color: var(--faint); padding: 7px 2px 0; }

  .panel-head { display: flex; align-items: center; gap: 8px; padding: 12px 16px 0; }
  #closeNote {
    display: none;
    background: none;
    border: 0;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    padding: 2px 8px;
  }
  #noteView { flex: 1; overflow-y: auto; padding: 8px 18px 20px; font-size: 13.5px; line-height: 1.6; }
  #noteView h2 { font-size: 17px; margin: 6px 0 12px; letter-spacing: -0.01em; }
  #noteView h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--faint);
    margin: 18px 0 6px;
    font-weight: 700;
  }
  #noteView p { margin: 6px 0; color: var(--muted); }
  #noteView ul { margin: 6px 0; padding-left: 18px; }
  #noteView li { margin: 4px 0; color: var(--muted); }
  #noteView a { color: var(--indigo-600); cursor: pointer; text-decoration: none; font-weight: 500; }
  #noteView a:hover { text-decoration: underline; }
  #noteView li::marker { color: #c4c9d6; }

  #openNoteBtn {
    display: none;
    position: absolute;
    right: 14px;
    bottom: 14px;
    z-index: 20;
    padding: 9px 16px;
    border-radius: 999px;
    border: 1px solid var(--border-strong);
    background: #fff;
    color: var(--text);
    font-size: 13px;
    font-family: var(--font);
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(16, 19, 34, 0.18);
  }

  @media (max-width: 760px) {
    header { padding: 8px 12px; gap: 8px; }
    header h1 { display: none; }
    #search { width: 150px; }
    aside {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      width: auto;
      max-height: 58%;
      border-left: 0;
      border-top: 1px solid var(--border);
      border-radius: 16px 16px 0 0;
      transform: translateY(100%);
      transition: transform 0.28s ease;
      z-index: 25;
      box-shadow: 0 -12px 40px rgba(16, 19, 34, 0.2);
    }
    aside.open { transform: none; }
    #closeNote { display: block; }
    #openNoteBtn.show { display: block; }
    #hint { display: none; }
  }
</style>
</head>
<body>
<header>
  <a class="back" href="/">← Portfolio</a>
  <h1><span class="disp">Knowledge</span> <span>graph</span></h1>
  <span id="stats"></span>
  <div class="controls">
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search notes…" autocomplete="off" aria-label="Search notes">
      <div id="matches"></div>
    </div>
    <button id="fitBtn" title="Reset view">Fit</button>
    <a class="powered-link" href="https://webcules.com" target="_blank" rel="noopener">Powered by <strong>Webcules</strong></a>
  </div>
</header>
<main>
  <div id="canvasWrap">
    <canvas id="canvas"></canvas>
    <div id="loading">Loading graph…</div>
    <div id="hint">drag · scroll to zoom · double-click to fit · click a category to focus · click a node to read</div>
    <button id="openNoteBtn">Read note</button>
  </div>
  <aside id="panel">
    <div id="legendPanel">
      <span class="panel-label">Focus a category</span>
      <div class="legend" id="legend"></div>
      <div class="legend-hint">Click a category to spotlight its nodes; click again (or All) to reset.</div>
    </div>
    <div class="panel-head">
      <div class="panel-label">Note — click any node to read it</div>
      <button id="closeNote" aria-label="Close note">✕</button>
    </div>
    <div id="noteView"></div>
  </aside>
</main>

    if (pointers.size === 2) {
      var pts = [...pointers.values()];
      pinchPrev = { d: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y), mx: (pts[0].x + pts[1].x) / 2, my: (pts[0].y + pts[1].y) / 2 };
      dragNode = null; panning = false;
      return;
    }
    downX = p.x; downY = p.y; lastX = p.x; lastY = p.y; moved = false;
    var n = nodeAt(p.x, p.y);
    if (n) { dragNode = n; } else { panning = true; }
    alpha = Math.max(alpha, 0.5);
  });

  canvas.addEventListener('pointermove', function (e) {
    if (pointers.has(e.pointerId)) pointers.set(e.pointerId, localPos(e));
    if (pointers.size === 2 && pinchPrev) {
      var pts = [...pointers.values()];
      var d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      var mx = (pts[0].x + pts[1].x) / 2, my = (pts[0].y + pts[1].y) / 2;
      if (pinchPrev.d > 0) zoomAt(mx, my, d / pinchPrev.d);
      tx += mx - pinchPrev.mx; ty += my - pinchPrev.my;
      pinchPrev = { d: d, mx: mx, my: my };
      return;
    }
    var p = localPos(e);
    if (Math.hypot(p.x - downX, p.y - downY) > 4) moved = true;
    if (dragNode) {
      var wp = toWorld(p.x, p.y);
      dragNode.x = wp.x; dragNode.y = wp.y;
      alpha = Math.max(alpha, 0.35);
    } else if (panning && pointers.size === 1) {
      tx += p.x - lastX; ty += p.y - lastY;
    } else if (pointers.size === 0 || e.pointerType === 'mouse') {
      var hv = nodeAt(p.x, p.y);
      if (hv !== hover) { hover = hv; canvas.style.cursor = hv ? 'pointer' : 'grab'; }
    }
    lastX = p.x; lastY = p.y;
  });

  function endPointer(e) {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchPrev = null;
    var p = localPos(e);
    var n = nodeAt(p.x, p.y);
    if (!moved && n && n === dragNode) select(n, true);
    dragNode = null; panning = false;
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', function (e) { pointers.delete(e.pointerId); pinchPrev = null; dragNode = null; panning = false; });
  canvas.addEventListener('dblclick', function () { fit(); alpha = 0.8; });

  /* ---------- note panel ---------- */
  function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  function renderNote(n) {
    var html = '';
    var inList = false;
    n.text.split('\n').forEach(function (line) {
      var isBullet = /^- /.test(line);
      var content = esc(line.replace(/^- /, ''));
      content = content.replace(/\[\[([^\]|]+)(\|[^\]]+)?\]\]/g, function (m, p1) {
        return '<a data-note="' + p1.trim().replace(/"/g, '&quot;') + '">' + esc(p1.trim()) + '</a>';
      });
      if (/^# /.test(line)) {
        if (inList) { html += '</ul>'; inList = false; }
        html += '<h2 style="color:' + n.color + '">' + content.slice(2) + '</h2>';
      } else if (/^## /.test(line)) {
        if (inList) { html += '</ul>'; inList = false; }
        html += '<h3>' + content.slice(3) + '</h3>';
      } else if (isBullet) {
        if (!inList) { html += '<ul>'; inList = true; }
        html += '<li>' + content + '</li>';
      } else if (line.trim() === '') {
        if (inList) { html += '</ul>'; inList = false; }
      } else {
        if (inList) { html += '</ul>'; inList = false; }
        html += '<p>' + content + '</p>';
      }
    });
    if (inList) html += '</ul>';
    html += '<p style="margin-top:16px"><a href="/">← Back to the portfolio</a></p>';
    noteView.innerHTML = html;
    noteView.scrollTop = 0;
    noteView.querySelectorAll('a[data-note]').forEach(function (a) {
      a.addEventListener('click', function () {
        var t = byTitle[a.getAttribute('data-note')];
        if (t) { select(t, true); }
      });
    });
  }

  function select(node, fromUser) {
    selected = node;
    hover = null;
    renderNote(node.n);
    panel.classList.add('open');
    openNoteBtn.classList.remove('show');
    if (fromUser) centerOn(node);
    history.replaceState(null, '', '#' + encodeURIComponent(node.n.title));
  }
  function deselect() {
    selected = null;
    noteView.innerHTML = '';
    panel.classList.remove('open');
    history.replaceState(null, '', location.pathname);
  }

  document.getElementById('closeNote').addEventListener('click', deselect);
  document.getElementById('fitBtn').addEventListener('click', function () { setFocus(null); alpha = 0.8; });

  /* ---------- search ---------- */
  searchEl.addEventListener('input', function () {
    var q = searchEl.value.trim().toLowerCase();
    matchesEl.innerHTML = '';
    if (q.length < 2) { matchesEl.style.display = 'none'; return; }
    var hits = nodes.filter(function (n) {
      return visible(n) && n.n.title.toLowerCase().indexOf(q) !== -1;
    }).slice(0, 8);
    if (!hits.length) { matchesEl.style.display = 'none'; return; }
    hits.forEach(function (n) {
      var b = document.createElement('button');
      b.innerHTML = esc(n.n.title) + '<small>' + (FOLDER_LABELS[n.n.folder] || n.n.folder) + '</small>';
      b.addEventListener('click', function () {
        matchesEl.style.display = 'none';
        searchEl.value = '';
        alpha = Math.max(alpha, 0.5);
        select(n, true);
      });
      matchesEl.appendChild(b);
    });
    matchesEl.style.display = 'block';
  });
  document.addEventListener('click', function (e) {
    if (!matchesEl.contains(e.target) && e.target !== searchEl) matchesEl.style.display = 'none';
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { deselect(); matchesEl.style.display = 'none'; }
  });

  openNoteBtn.addEventListener('click', function () {
    if (selected) { panel.classList.add('open'); openNoteBtn.classList.remove('show'); }
  });

  /* ---------- resize ---------- */
  function sizeCanvas() {
    var dpr = window.devicePixelRatio || 1;
    var w = wrap.clientWidth, h = wrap.clientHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', sizeCanvas);
})();
</script>
</body>
</html>
